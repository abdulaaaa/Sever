<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page blocked</title>
  <link rel="stylesheet" href="../../assets/styles/theme.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
    main { max-width: 540px; width: 100%; text-align: center; }
    .label { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .6rem; }
    h1 { font-size: 1.5rem; margin: 0 0 .5rem; word-break: break-word; }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); margin: 0 0 1.4rem; }
    .counts { display: flex; gap: 10px; justify-content: center; }
    .counts div { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 18px; min-width: 80px; }
    .counts b { display: block; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
    .counts small { color: var(--muted); }
    .note { margin-top: 1.4rem; color: var(--muted); }
    .bar { max-width: 320px; margin: 0 auto; }
  </style>
</head>
<body>
  <main>
    <p class="label" id="label">Blocked</p>
    <h1 id="title">This page is blocked</h1>
    <p class="sub" id="sub"></p>
    <div class="counts" id="counts" hidden>
      <div><b id="c-today">0</b><small>today</small></div>
      <div><b id="c-week">0</b><small>this week</small></div>
      <div><b id="c-total">0</b><small>in total</small></div>
    </div>
    <div class="bar out" id="bar" hidden><i style="width:100%"></i></div>
    <p class="note" id="note">Close this tab and carry on.</p>
  </main>
  <script type="module" src="blocked.js"></script>
</body>
</html>
